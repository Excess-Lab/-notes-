# Сборка Tauri-версии на Windows и macOS: облачная сессия на Linux их не соберёт.
# Установщики — во вкладке Actions → прогон → Artifacts.
name: desktop

on:
  push:
    branches: [Dev-Windows]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p notes-core
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: cargo test -p notes-core
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: notes-${{ matrix.os }}
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
