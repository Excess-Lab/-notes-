[package]
name = "notes-desktop"
description = "<notes> desktop app on Tauri: Windows now, macOS later"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "notes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notes-core = { path = "../core" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
trash = "5"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
raw-window-handle = "0.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
