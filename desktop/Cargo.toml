[workspace]
members = ["core", "speech", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Пинкод — 200 000 раундов PBKDF2: в отладочной сборке без оптимизации это секунды на проверку.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
